<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scala=1.0">
    <link type="text/css" rel="stylesheet" href="./calculadora.css">
    <title>calculadora</title>
  </head>
  <body>
    <main>
      <div class="layout">
        <div class="js-visor visor"></div>
        <div class="numeros">
          <button >9</button>
          <button >8</button>
          <button >7</button>
          <button >6</button>
          <button >5</button>
          <button >4</button>
          <button >3</button>
          <button >2</button>
          <button >1</button>
          <button >.</button>
          <button >0</button>
          <button >=</button>
        </div>
        <div class="sinais">
          <button>%</button>
          <button>/</button>
          <button>*</button>
          <button>-</button>
          <button>+</button>
        </div>
        <div class="deletar">
          <button>ac</button>
          <button>del</button>
        </div>
      </div>
    </main>
  </body>
</html>

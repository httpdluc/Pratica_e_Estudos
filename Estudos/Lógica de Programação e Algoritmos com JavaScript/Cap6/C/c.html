<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width = device-width, initial-scale = 1.0">
        <title>Exercício 6.C</title>
    </head>
    <body>
        <h1>Programa Concurso</h1>

        <form>
            <p>
                Candidato: <input type="text" id="inAluno" autofocus required>
            </p>
            <p>
                Nº de Acertos: <input type="number" min="1" max="100" id="inNota" required>
                <input type="submit" value="Adicionar">
            </p>
            <p>
                <input type="button" value="Listar Todos" id="btListar">
                <input type="button" value="Aprovados 2º Etapa" id="btEtapa">
            </p>
            <p>
                Informar o Número de Acertos para Aprovação:
                <input type="number" min="1" max="100" id="inAprovacao">
                <input type="button" value="Nota de Corte" id="btCorte">
            </p>
        </form>
        <h4></h4>
        <pre> </pre>
        <script src="./c.js"></script>
    </body>
</html>

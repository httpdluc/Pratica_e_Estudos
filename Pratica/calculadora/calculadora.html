<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" href="./calculadora.css">
    <link type="image/png" rel="icon" href="./icon/calculadora.png">
    <title>calculadora</title>
  </head>
  <body>
    <main id="calculadora">
      <div class="layout">
        <div class="js-visor visor"></div>
        <div class="js-numeros numeros">
          <button value="9">9</button>
          <button value="8">8</button>
          <button value="7">7</button>
          <button value="6">6</button>
          <button value="5">5</button>
          <button value="4">4</button>
          <button value="3">3</button>
          <button value="2">2</button>
          <button value="1">1</button>
          <button value=".">.</button>
          <button value="0">0</button>
          <button value="=">=</button>
        </div>
        <div class="js-sinais sinais">
          <button value="%">%</button>
          <button value="/">÷</button>
          <button value="*">•</button>
          <button value="-">-</button>
          <button value="+">+</button>
        </div>
        <div class="js-deletar deletar">
          <button value="ac">ac</button>
          <button value="del">del</button>
        </div>
      </div>
    </main>
    <script src="./calculadora.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="stylesheet" href="./jokenpo.css">
  </head>
  <body>
    <main class="game">
      <h1 class="title">Jokenpo</h1>
      <div class="elements">
        <button class="js-bt-rock rock">✊</button>
        <button class="js-bt-paper paper">🖐️</button>
        <button class="js-bt-scissors scissors">✌️</button>
      </div>
      <div class="status">
        <h2 class="js-res res">vitória</h2>
        <div class="jogadores"><p class="jogador">Jogador</p><p class="sinal">X</p><p class="pc">computador</p></div>
        <div class="js-placar placar"><p class="js-jogador jogador">1</p><p class="sinal">-</p><p class="js-pc pc">0</p></div>
      </div>
      <div class="options">
        <button class="js-bt-reset reset">resetar placar</button>
        <button class="js-bt-autoplay autoplay">jogo automático</button>
      </div>
    </main>
    <script src="./jokenpo.js"></script>
  </body>
</html>
